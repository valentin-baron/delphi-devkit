[package]
name = "delphi-parser"
version = "0.1.0"
edition = "2024"

[features]
# Machine-bound tests (C:\Delphi\VSS paths, live ddk CLI). Off by default:
# `cargo test` stays portable; run all with `cargo test --features local-tests`.
local-tests = []

[dependencies]
bincode = "1.3"
bitflags = "2.13.1"
flate2 = "1.0"
dproj-rs = "0.3.0"
elsa = "1.11.2"
lasso = { version = "0.7.3", features = ["multi-threaded"] }
logos = "0.16.1"
moka = { version = "0.12.15", features = ["sync"] }
notify = "8.2.0"
once_cell = "1.20"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
serde_yaml = "0.9"
windows = { version = "0.62.2", features = ["Win32_Globalization"] }
xxhash-rust = { version = "0.8.17", features = ["xxh3"] }
